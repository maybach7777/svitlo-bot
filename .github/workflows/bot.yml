name: svitlo
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
